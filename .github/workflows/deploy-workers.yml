name: Deploy Workers

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    defaults:
      run:
        working-directory: casezero-mvp

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify Cloudflare secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "${CLOUDFLARE_API_TOKEN}" ] || [ -z "${CLOUDFLARE_ACCOUNT_ID}" ]; then
            echo "Cloudflare deployment secrets are missing."
            echo ""
            echo "Required GitHub secrets:"
            echo "  CLOUDFLARE_API_TOKEN  - API token with the following permissions:"
            echo "    - Account > Workers Scripts > Edit"
            echo "    - Account > Workers Assets > Write"
            echo "    - User > User Details > Read"
            echo "    - User > Memberships > Read"
            echo "  CLOUDFLARE_ACCOUNT_ID - Your Cloudflare account ID"
            echo ""
            echo "Create a new API token at https://dash.cloudflare.com/profile/api-tokens"
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
          cache-dependency-path: casezero-mvp/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Publish to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: casezero-mvp
          command: deploy --config wrangler.json
