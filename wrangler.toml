name = "casezero-mvp"
main = "worker/index.ts"
compatibility_date = "2024-12-16"

# D1 Database Binding
[[d1_databases]]
binding = "DB"
database_name = "casezero"
database_id = "unique-database-id"

# Environment variables
[env.production]
name = "casezero-mvp-prod"

[env.development]
name = "casezero-mvp-dev"

# Build
[build]
command = "npm run build"

# Observability
[observability]
enabled = true
